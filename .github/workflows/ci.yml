# Lightweight CI: install deps and run the offline test suite.
# No AWS credentials are used — tests run entirely in demo mode.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (offline demo mode, no AWS)
        env:
          BULLBOT_DEMO_MODE: "1"
        run: python -m pytest tests/ -v
